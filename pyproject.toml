[project]
name = "librepost-app"
version = "0.7.0"
description = "A free, local-first API client. Requests live as plain .http files in your git repo; secrets stay in your keychain."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/librepost/static/vendor/htmx-LICENSE.txt"]
authors = [{ name = "Ag3nt Sc4rn" }]
requires-python = ">=3.11"
keywords = ["api", "http", "rest", "client", "postman-alternative", "http-file", "git", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "keyring>=25.0",
    "python-multipart>=0.0.9",
    "rich>=13.7",
    "starlette>=0.40",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/ag3ntsc4rn/librepost"
Issues = "https://github.com/ag3ntsc4rn/librepost/issues"
Changelog = "https://github.com/ag3ntsc4rn/librepost/blob/main/CHANGELOG.md"

[project.scripts]
librepost = "librepost.cli:app"
# Same command under the PyPI name, so `uvx librepost-app ui` works.
librepost-app = "librepost.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "ruff>=0.6",
    "cryptography>=50.0.2",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The PyPI name is librepost-app; the importable package is librepost.
module-name = "librepost"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# The formatter keeps code within line-length; long string literals are left alone.
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["keyring", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette suggests httpx2 for its TestClient; httpx is what librepost ships with.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
