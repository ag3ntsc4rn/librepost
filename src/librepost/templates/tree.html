{% for entry in entries %}
<section class="file">
  <h3 class="file-name" title="{{ entry.path }}">{{ entry.path }}</h3>
  {% if entry.error %}
  <p class="error small">{{ entry.error }}</p>
  {% endif %}
  <ul>
    {% for method, name in entry.requests %}
    <li>
      <a href="#" class="req-link" hx-get="/request?file={{ entry.path | urlencode }}&amp;index={{ loop.index0 }}" hx-target="#main">
        <span class="method m-{{ method | lower }}">{{ method }}</span>
        <span class="req-name">{{ name }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</section>
{% else %}
<p class="muted small">No .http files here yet. Create one above, or run <code>librepost init</code>.</p>
{% endfor %}
